# /etc/nginx/sites-available/myapp-gateway.conf — same pattern as licensing.conf (Cloudflare origin certificate).
# Install:
#   sudo cp nginx-myapp-gateway.conf /etc/nginx/sites-available/myapp-gateway.conf
#   sudo ln -s /etc/nginx/sites-available/myapp-gateway.conf /etc/nginx/sites-enabled/myapp-gateway.conf
#   sudo nginx -t && sudo systemctl reload nginx
# DNS: add `myapp-gateway` (proxied) in Cloudflare for smartappdz.org.

# The real phone IP for the login rate limit: Cloudflare puts it in CF-Connecting-IP.
map $http_cf_connecting_ip $myapp_gateway_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    listen [::]:80;
    server_name {gateway-host};

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name {gateway-host};

    client_max_body_size 1m;

    ssl_certificate /etc/ssl/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/ssl/private/cloudflare-origin.key;

    location / {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $myapp_gateway_client_ip;
        proxy_set_header X-Forwarded-For $myapp_gateway_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pharmacy agents keep a SignalR WebSocket open; keep-alive pings every 15 s keep it under these timeouts.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
